<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Caminante</title>
<link rel="stylesheet" href="pub-app.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="pub-core.jsx"></script>
<script type="text/babel" src="pub-a.jsx"></script>
<script type="text/babel" src="pub-b.jsx"></script>
<script type="text/babel" src="pub-c.jsx"></script>
<script type="text/babel" src="pub-aprende.jsx"></script>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
const SCREENS={exp:PubExp,destino:PubDestino,operador:PubOperador,calendario:PubCalendario,capsula:PubCapsula,serie:PubSerie,reservar:PubReservar,exito:PubExito,deslinde:PubDeslinde,solicitar:PubSolicitar,viaje:PubViaje,expediente:PubExpediente,feedback:PubFeedback,crear:PubCrear,bienvenida:PubBienvenida,embajadores:PubEmbajadores,facturacion:PubFacturacion,privacidad:PubPrivacidad,baja:PubBaja,nosotros:PubNosotros};
const SHEETS={menu:ShMenu,avisame:ShAvisame};

function App(){
const [tab,setTab]=useState("inicio");
const [stack,setStack]=useState([]);
const [sheet,setSheet]=useState(null);
const [toast,setToast]=useState(null);
const [S,setS]=useState({
 sesion:false,deslindeOk:false,
 usuario:{nombre:"Mariana López",mail:"mariana@—.mx",tel:"55 1234 5678",acomp:["Jorge López"]},
 viajes:[{id:"v1",exp:"ensenada",fecha:"Jun 2026",pax:2,total:32000,proximo:false,resena:5}],
});
const toastT=useRef(null);
const toastify=(t,s)=>{clearTimeout(toastT.current);setToast({t,s});toastT.current=setTimeout(()=>setToast(null),4000);};
const A={
 entrar:nombre=>setS(s=>({...s,sesion:true,usuario:{...s.usuario,nombre:nombre||s.usuario.nombre}})),
 salir:()=>{setS(s=>({...s,sesion:false}));setStack([]);setTab("inicio");},
 comprar:(e,sal,pax,total)=>setS(s=>({...s,sesion:true,deslindeOk:false,viajes:[{id:"v"+Date.now(),exp:e.id,fecha:sal.lbl+" 2026",dias:"en "+Math.max(1,Math.round((new Date(sal.fecha)-new Date("2026-08-10"))/86400000))+" días",pax,total,proximo:true},...s.viajes]})),
 firmar:()=>setS(s=>({...s,deslindeOk:true})),
 resena:(id,r)=>setS(s=>({...s,viajes:s.viajes.map(v=>v.id===id?{...v,resena:r}:v)})),
};
const nav={
 tab,
 setTab:t=>{setTab(t);setStack([]);},
 push:(id,params)=>setStack(st=>[...st,{id,params:params||{}}]),
 pop:()=>setStack(st=>st.slice(0,-1)),
 replace:(id,params)=>setStack(st=>[...st.slice(0,-1),{id,params:params||{}}]),
 reset:()=>setStack([]),
};
const ui={toastify,openSheet:(id,params)=>setSheet({id,params:params||{}}),closeSheet:()=>setSheet(null)};
nav.ui=ui;
const top=stack[stack.length-1];
const cuarto=S.sesion?"espacio":"entrar";
const ROOTS={inicio:PubInicio,experiencias:PubExps,aprende:PubAprende,espacio:S.sesion?PubEspacio:PubEntrar};
const Screen=top?SCREENS[top.id]:ROOTS[tab];
const Sheet=sheet?SHEETS[sheet.id]:null;
const pendiente=S.sesion&&!S.deslindeOk&&S.viajes.some(v=>v.proximo);
const scrollRef=useRef(null);
useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=0;},[tab,stack.length]);
const buyScreens=["exp","reservar"];
return <div className="pub-app">
<div className={"pub-scroll"+(top&&buyScreens.includes(top.id)?" buypad":"")} ref={scrollRef} key={tab+"/"+stack.length}>
<Screen S={S} A={A} nav={nav} ui={ui} params={top?top.params:{}}/>
</div>
{!top&&<nav className="pub-tabbar">
{[["inicio","Inicio"],["experiencias","Experiencias"],["aprende","Aprende"],["espacio",S.sesion?"Mi espacio":"Entrar"]].map(([id,lbl])=>
<button key={id} className={"pub-tab"+(tab===id?" on":"")} onClick={()=>nav.setTab(id)}>
{TabIcons[id]}<span>{lbl}</span>
{id==="espacio"&&pendiente&&<span className="dot"></span>}
</button>)}
</nav>}
{sheet&&<div className="pub-dim" onClick={ui.closeSheet}></div>}
{Sheet&&<Sheet S={S} A={A} nav={nav} ui={ui} params={sheet.params}/>}
{toast&&<div className="pub-toast"><span className="ok">✓</span><span className="tx"><b>{toast.t}</b>{toast.s}</span></div>}
</div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
